# Measured locally (optimize project) — NOT a Spark Arena scrape.
# Test: tg128 @ d16384 (board's exact test, llama-benchy) | single GB10, TP=1 | 2026-06-06
#   conc=2 (board metric): ~120 tok/s (two batches: 128.5±15 and 115.2±4) — BEATS board #10 NVFP4 (111.9),
#                          within ~2% of the #6 INT4 leader (131.4). peak 160.
#   conc=1 solo:           ~96 tok/s
# Model: nvidia/Qwen3.6-35B-A3B-NVFP4 (modelopt) + z-lab/Qwen3.6-35B-A3B-DFlash drafter.
# THE KEY KNOB: num_speculative_tokens=6 (NOT 15). Found via a fast autotune sweep. At ~24-40% draft
#   acceptance, k=15 wastes verify-compute and the gain "washes out" at conc=2 (94.9); k=6 keeps the easy
#   predictions cheaply → +35% at conc=2. (Matches why board rank06/rank10 use k=6/k=8.)
# Backend story: NVFP4 marlin weights + DFlash fused. KV conflict (DFlash needs BF16-KV + flash_attn;
#   NVFP4 used fp8-KV) resolved by DROPPING fp8-KV and forcing --attention-backend flash_attn. Plain
#   latency mode + O2 — throughput flags / -O3 added variance with no gain on this checkpoint.
recipe_version: '1'
name: measured-qwen3.6-35b-a3b-nvfp4-dflash
description: nvidia/Qwen3.6-35B-A3B-NVFP4 marlin + z-lab DFlash k=6 — ~120 c2, beats board #10 NVFP4
model: nvidia/Qwen3.6-35B-A3B-NVFP4
container: vllm-node
solo_only: true
mods:
  - mods/fix-qwen3.6-chat-template
env:
  VLLM_NVFP4_GEMM_BACKEND: marlin
  VLLM_TEST_FORCE_FP8_MARLIN: '0'
defaults:
  port: 8000
  host: 0.0.0.0
  gpu_memory_utilization: 0.8
  max_model_len: 32768
  max_num_batched_tokens: 16384
  max_num_seqs: 32
  num_speculative_tokens: 6
command: |
  vllm serve nvidia/Qwen3.6-35B-A3B-NVFP4 \
    --host {host} --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --moe-backend marlin \
    --attention-backend flash_attn \
    --load-format fastsafetensors \
    --enable-prefix-caching \
    --trust-remote-code \
    --speculative-config '{{"method":"dflash","model":"z-lab/Qwen3.6-35B-A3B-DFlash","num_speculative_tokens":{num_speculative_tokens}}}'
